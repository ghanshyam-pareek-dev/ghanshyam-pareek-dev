<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.5" stop-color="#0C1728"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 84) scale(330 210)">
      <stop stop-color="#25F4EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#25F4EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(970 280) scale(350 220)">
      <stop stop-color="#A3FF12" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#A3FF12" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#panel)"/>
  <rect width="1200" height="360" rx="28" fill="url(#cyan)"/>
  <rect width="1200" height="360" rx="28" fill="url(#green)"/>
  <text x="60" y="66" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Builder Command Center</text>
  <text x="60" y="98" fill="#AAB8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">The places where my business, creative, automation, and code work meet.</text>
  <g filter="url(#shadow)">
    <g transform="translate(60 132)">
      <rect width="252" height="150" rx="20" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="22" y="42" fill="#8DFCF7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">AI Automation</text>
      <text x="22" y="76" fill="#EAF3FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Prompt systems</text>
      <text x="22" y="102" fill="#AAB8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Workflows, tools, speed</text>
    </g>
    <g transform="translate(340 132)">
      <rect width="252" height="150" rx="20" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="22" y="42" fill="#A3FF12" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Startup Ops</text>
      <text x="22" y="76" fill="#EAF3FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Business systems</text>
      <text x="22" y="102" fill="#AAB8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Strategy, execution, growth</text>
    </g>
    <g transform="translate(620 132)">
      <rect width="252" height="150" rx="20" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="22" y="42" fill="#C4B5FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Design Studio</text>
      <text x="22" y="76" fill="#EAF3FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Brand visuals</text>
      <text x="22" y="102" fill="#AAB8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Canva, Figma, Photoshop</text>
    </g>
    <g transform="translate(900 132)">
      <rect width="252" height="150" rx="20" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="22" y="42" fill="#FACC15" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Full-Stack Lab</text>
      <text x="22" y="76" fill="#EAF3FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Learning by shipping</text>
      <text x="22" y="102" fill="#AAB8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">HTML, CSS, JS, React, Node</text>
    </g>
  </g>
</svg>
