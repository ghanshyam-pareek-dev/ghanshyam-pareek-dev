    <g transform="translate(848 154)">
      <rect width="340" height="86" rx="16" fill="#111A27" stroke="#38BDF8" stroke-opacity=".82"/>
      <rect x="22" y="18" width="58" height="50" rx="12" fill="#080B12" stroke="#334155"/>
      <path d="M70 25H49C34 25 25 34 25 43C25 54 34 62 49 62H70V51H50C43 51 38 48 38 43C38 38 43 35 50 35H70C77 35 82 40 82 46V49H93V43C93 33 84 25 70 25Z" fill="#F8FAFC"/>
