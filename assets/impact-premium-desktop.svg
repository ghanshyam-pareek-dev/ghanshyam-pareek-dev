      .tag{font:700 12px Segoe UI,Inter,Arial,sans-serif;fill:#8FB9FF;letter-spacing:1.5px}
      .mini{font:800 12px Segoe UI,Inter,Arial,sans-serif;fill:#F8FAFC}
      .lacsa{font:900 14px Segoe UI,Inter,Arial,sans-serif;fill:#FFFFFF;letter-spacing:.5px}
    </style>
  </defs>

  <rect width="1280" height="300" rx="22" fill="url(#panel)"/>
  <circle cx="110" cy="42" r="110" fill="#1D4ED8" opacity=".16"/>
  <circle cx="1150" cy="265" r="160" fill="#F59E0B" opacity=".12"/>

  <g filter="url(#shadow)">
    <rect x="48" y="36" width="1184" height="228" rx="24" fill="url(#glass)" stroke="#273449" stroke-width="1.4"/>
    <path d="M92 84H1188" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
    <text x="92" y="127" class="title">Profile Snapshot</text>

