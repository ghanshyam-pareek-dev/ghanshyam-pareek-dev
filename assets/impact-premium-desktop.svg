<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1280" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset=".52" stop-color="#070B12"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="glass" x1="80" y1="80" x2="1200" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2433" stop-opacity=".84"/>
      <stop offset=".55" stop-color="#101722" stop-opacity=".78"/>
      <stop offset="1" stop-color="#172033" stop-opacity=".84"/>
    </linearGradient>
    <linearGradient id="stroke" x1="95" y1="58" x2="1185" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset=".5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="line" x1="98" y1="78" x2="1182" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset=".48" stop-color="#9B8CFF"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="20" y="20" width="1240" height="260" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".46"/>
    </filter>
    <style>
      .title{font:800 26px Segoe UI,Inter,Arial,sans-serif;fill:#F8FAFC}
