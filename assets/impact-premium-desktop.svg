      <text x="35" y="40" class="lacsa">LACSA</text>
      <text x="34" y="56" class="mini">TECH</text>
      <path d="M62 25L73 35M68 31L50 65" stroke="#FACC15" stroke-width="5" stroke-linecap="round"/>
      <path d="M72 33L76 37" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
      <text x="108" y="46" class="role">CEO</text>
      <text x="110" y="70" class="company">Lacsa Tech</text>
    </g>

    <g transform="translate(470 154)">
      <rect width="340" height="86" rx="16" fill="#111A27" stroke="#7C5CFF" stroke-opacity=".82"/>
      <rect x="22" y="18" width="58" height="50" rx="12" fill="#080B12" stroke="#334155"/>
      <path d="M50 25L25 62H41L57 42L72 62H88L50 25Z" fill="#F8FAFC"/>
